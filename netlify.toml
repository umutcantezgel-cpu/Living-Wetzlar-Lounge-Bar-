# Netlify Configuration for Classic Shisha Lounge Website

[build]
  command = "npm run build"
  publish = "dist"

  # Build environment variables
  [build.environment]
    NODE_VERSION = "18"
    NPM_VERSION = "9"

# Production context (main branch)
[context.production]
  command = "npm run build"

  [context.production.environment]
    NODE_ENV = "production"

# Deploy Preview context (pull requests)
[context.deploy-preview]
  command = "npm run build"

# Branch deploys
[context.branch-deploy]
  command = "npm run build"

# SPA redirect - serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Optional: Redirect HTTP to HTTPS
[[redirects]]
  from = "http://classic-shisha-lounge.netlify.app/*"
  to = "https://classic-shisha-lounge.netlify.app/:splat"
  status = 301
  force = true

# Cache static assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;"

# Cache HTML files for 1 hour
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache JavaScript and CSS with fingerprinting
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Development server configuration
[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  autoLaunch = true

# Plugin configuration (optional optimizations)
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "reports/lighthouse.html"
