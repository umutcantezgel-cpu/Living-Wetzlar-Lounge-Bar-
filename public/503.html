<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Retry-After" content="3600">
  <title>503 – Wartungsarbeiten | Living Wetzlar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1A1A1A 0%, #262626 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container {
      text-align: center;
      max-width: 32rem;
    }
    h1 {
      font-size: clamp(4rem, 15vw, 8rem);
      color: #D4AF37;
      margin-bottom: 1rem;
      line-height: 1;
      font-weight: 700;
    }
    h2 {
      font-size: 1.875rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.125rem;
      color: #D4D4D4;
      margin-bottom: 2rem;
      line-height: 1.625;
    }
    a {
      display: inline-block;
      padding: 0.75rem 2rem;
      background-color: #D4AF37;
      color: #fff;
      text-decoration: none;
      border-radius: 0.375rem;
      font-weight: 600;
      transition: transform 200ms;
    }
    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>503</h1>
    <h2>Wartungsarbeiten</h2>
    <p>
      Wir führen gerade Wartungsarbeiten durch. Die Website steht in Kürze wieder zur Verfügung.
    </p>
    <p>Bitte versuchen Sie es später erneut.</p>
    <a href="/">Erneut versuchen</a>
  </div>
</body>
</html>
