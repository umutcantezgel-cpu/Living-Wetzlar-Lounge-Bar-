<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>

    <!-- Security Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Primary Meta Tags (will be replaced by React Helmet) -->
    <title>Premium Shisha Lounge & Café Dillenburg</title>
    <meta name="title" content="Premium Shisha Lounge & Café Dillenburg – Startseite">
    <meta name="description" content="Erleben Sie Premium Shisha-Kultur, exzellenten Kaffee und einzigartige Events in Dillenburg. Über 3000 zufriedene Gäste!">

    <!-- Robots -->
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://classic-shisha-dillenburg.de/">
    <meta property="og:title" content="Premium Shisha Lounge & Café Dillenburg">
    <meta property="og:description" content="Erleben Sie Premium Shisha-Kultur, exzellenten Kaffee und einzigartige Events in Dillenburg.">
    <meta property="og:image" content="https://classic-shisha-dillenburg.de/assets/images/og-image.jpg">
    <meta property="og:site_name" content="Classic Shisha Lounge">
    <meta property="og:locale" content="de_DE">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://classic-shisha-dillenburg.de/">
    <meta property="twitter:title" content="Premium Shisha Lounge & Café Dillenburg">
    <meta property="twitter:description" content="Erleben Sie Premium Shisha-Kultur, exzellenten Kaffee und einzigartige Events in Dillenburg.">
    <meta property="twitter:image" content="https://classic-shisha-dillenburg.de/assets/images/og-image.jpg">

    <!-- Theme Color -->
    <meta name="theme-color" content="#00FFFF">
    <meta name="msapplication-TileColor" content="#0a0e27">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest">
  </head>
  <body>
    <!-- Skip Link for Accessibility -->
    <a href="#main" class="skip-link">Direkt zum Inhalt</a>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
